<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO title -->
    <title>EvolveVue | Medical Services & Outsourcing Solutions in Nepal</title>

    <!-- Meta description -->
    <meta
      name="description"
      content="EvolveVue provides trusted medical services, healthcare outsourcing, and business process solutions in Nepal. Partner with us for reliable, efficient, and affordable services."
    />

    <!-- Keywords (less important today, but still can help slightly) -->
    <meta
      name="keywords"
      content="EvolveVue, medical services Nepal, healthcare outsourcing, outsource services Nepal, BPO Nepal, healthcare solutions, medical outsourcing"
    />

    <!-- Open Graph for social sharing -->
    <meta
      property="og:title"
      content="EvolveVue - Medical Services & Outsourcing"
    />
    <meta
      property="og:description"
      content="Reliable medical and outsourcing services in Nepal."
    />
    <meta property="og:url" content="https://evolvevue.com.np" />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/evolve.png" />

    <!-- Google Fonts: Inter + Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Preload critical fonts -->
    <link
      rel="preload"
      href="/fonts/inter-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link
      rel="preload"
      href="/fonts/montserrat-semibold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>

  <body class="bg-size-200%">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
